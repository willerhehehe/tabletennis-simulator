<header><h1>乒乓策略</h1><p class="muted">读来球，抢位置，点球台出手。<span id="build-version"></span> · 单人对练 / 同机双人</p></header>
<main id="app"></main>
<footer>本机试玩 · 刷新会重新开局</footer>
<script type="module">
import { VERSION, skills, spins, allocation, newGame, act, view, botAction, distance, landing, movement, lateBudget, shotPreview, techniqueOptions, SERVES, TECH, SCENARIOS, scenarioGame, publicReplay } from './game.mjs';
import { courtMarkup, aimSummary, playerPoint, bouncePoint } from './court.mjs';
import { receivePlan, actionOrder } from './controls.mjs';
import { incomingFlight, movePawn, flyBall, showMiss } from './motion.mjs';
const app = document.querySelector('#app');
let game, config, builds = [], setupPlayer = 0, curtain = false, selected, target;
let busy=false;
let playHand='正手',playRead='下旋',playTech=null,manualPosition=false,recover=true;
const $ = id => document.getElementById(id);
$('build-version').textContent='v'+VERSION;
const name = n => n ? (game?.bot ? 'B（电脑）' : 'B') : 'A（你）';
const option = (values, value) => values.map(v => `<option ${v === value ? 'selected' : ''}>${v}</option>`).join('');
const select = (id, title, values, value) => `<label>${title} <select id="${id}">${option(values, value)}</select></label>`;
const showOdds=(e,serve)=>{if($('odds'))$('odds').textContent=`${serve?'发球':'按你的判断、中档旋转估计'}：正常 ${e.clean}% / 冒高 ${e.chance-e.clean}% / 失误 ${100-e.chance}%`;};
const errorBox = '<p id="error" class="error" role="alert"></p>';
const help = `<details><summary>规则与战术提示</summary><ol>
<li>回球由技术产生旋转。摆短 / 劈长输出下旋，拧拉输出侧上旋，拉球输出上旋；高球才可扣杀。基础模型采用反胶。</li>
<li>球的长度与第一次落点分开：短球预计能再跳一次，半出台在端线附近，长球会出台。长球可近台挡，不必先退到中台。</li>
<li>每板先预判移动，再调整，最后选技术和落点。看清后快球最多补 1 步，慢球最多补 2 步。提前能抢早摆短或快带；等待获得更可靠的旋转线索，但放弃提前移动并错过抢早技术。线索不保证正确。</li>
<li>旋转由你判断。显示的百分比是按判断估计的接回概率；骰子也可能产生冒高回球，给对手下一板机会，而不是直接失分。</li>
<li>速度、旋转、高度与技术质量分别计算。摆短也可以高质量。贴边落点更冒险，先调动再打空当。</li>
<li>挥拍后的还原可向中央走一步；大动作会减少下一板移动余量。跨身体使用正反手也有代价。</li>
<li>10 点隐藏属性，单项最多 5；零点也有基础能力。试探记录展示实际回球表现，不公布对手属性。</li>
<li>每人两次发球，平分延长阶段每分换发；净胜两分。5 分短局在 4:4 进入延长，11 分局在 10:10 进入延长。</li>
<li>同机双人请轮流回避屏幕。本地原型无网络防作弊；数值仍需真人试玩验证。原始规则研究和设计依据可在项目文档中查看。</li></ol></details>`;
function allocationScreen() {
  app.innerHTML = `<h2>${setupPlayer ? 'B 的秘密加点' : '选你的打法'}</h2><p>${setupPlayer ? '请 A 暂时回避屏幕。B 分配自己的 10 点。' : '选一种打法，马上开局。也可以展开自定义，分配自己的 10 点能力。'}</p>
  <div class="build-presets"><button data-build="2,2,2,2,2" aria-pressed="true"><strong>均衡型</strong><span>攻守都能接</span></button><button data-build="4,1,1,1,3" aria-pressed="false"><strong>正手突击</strong><span>用正手抢主动</span></button><button data-build="1,2,1,4,2" aria-pressed="false"><strong>反手控制</strong><span>稳住，再调动</span></button></div><details><summary>自定义加点${setupPlayer?'':' / 双人 / 赛制'}</summary>
  ${setupPlayer ? '' : `<div class="row">${select('mode','对局方式',['单人对练','同机双人'])}${select('target','每局得分',['5 分快速测试','11 分标准局'])}${select('best','赛制',['三局两胜','五局三胜'])}</div>`}
  <h3>${setupPlayer ? 'B' : 'A'} 的属性（对手不可见）</h3><div class="alloc">${skills.map((s,i)=>`<label for="skill${i}">${s}</label><input id="skill${i}" type="number" min="0" max="5" step="1" value="2">`).join('')}</div>
  <p id="remaining" aria-live="polite"></p></details>${errorBox}<button id="start" class="primary">${setupPlayer ? '锁定 B 属性' : '开始对局'}</button><details open><summary>先用一个情景学会战术</summary><div class="row">${Object.keys(SCENARIOS).map(k=>`<button class="scenario" data-key="${k}">${k}</button>`).join('')}</div></details>${help}`;
  app.querySelectorAll('.scenario').forEach(b=>b.onclick=()=>{game=scenarioGame(b.dataset.key);config={bot:true,target:11,bestOf:3};curtain=false;render();});
  const values = () => skills.map((_,i) => Number($('skill'+i).value));
  const update = () => { $('remaining').textContent = `剩余点数：${10-values().reduce((s,n)=>s+n,0)} · 每项上限 5`; $('start').disabled = !allocation(values()); };
  app.querySelectorAll('input').forEach(x => x.oninput = update); update();
  app.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{b.dataset.build.split(',').forEach((n,i)=>$('skill'+i).value=n);app.querySelectorAll('[data-build]').forEach(x=>x.setAttribute('aria-pressed',x===b));update();});
  $('start').onclick = () => {
    if (!allocation(values())) return;
    builds[setupPlayer] = values();
    if (!setupPlayer) config = { bot: $('mode').value === '单人对练', target: $('target').value.startsWith('5') ? 5 : 11, bestOf: $('best').value.startsWith('三') ? 3 : 5 };
    if (!setupPlayer && !config.bot) {
      setupPlayer = 1; app.innerHTML = '<h2>请将操作交给 B</h2><p>A 的属性已隐藏。A 请暂时回避屏幕。</p><button id="handoff" class="primary">我是 B，开始加点</button>';
      $('handoff').onclick = allocationScreen;
    } else {
      if(config.bot) builds[1] = [[4,1,1,1,3],[1,2,1,4,2],[2,1,2,1,4]][Math.floor(Math.random()*3)];
      tossScreen();
    }
  };
}
function tossScreen() {
  app.innerHTML = '<h2>由 A 猜左右手，决定首发</h2><p>猜中 A 先发，猜错 B 先发。</p><div class="row"><button id="left">猜左手</button><button id="right">猜右手</button></div>';
  const start = hand => { game = newGame({...config, builds, hand}); curtain = !game.bot; runBot(); render(); };
  $('left').onclick = () => start('左'); $('right').onclick = () => start('右');
}
function runBot() {
  // ponytail: 简单随机策略用于流程试玩；体验不足后再做会试探的对手。
  while (game.bot && game.actor === 1 && !['pointEnd','setEnd','matchEnd'].includes(game.phase)) act(game, botAction(view(game)));
}
async function submit(action) {
  if(busy)return;
  const actor=game.actor,before=view(game),phase=game.phase,svg=$('court')?.querySelector('svg');
  busy=true;app.inert=true;app.setAttribute('aria-busy','true');
  try {
    act(game,action);
    const contact=action.pos||before.own.pos;
    await movePawn(svg,actor,before.own.pos,contact).catch(()=>{});
    if(phase==='shot'||action.action==='return') {
      if(game.phase==='predict'&&game.ball.from===actor){
        await Promise.all([flyBall(svg,{from:playerPoint(contact,true),to:bouncePoint(game.ball.target,false)}),movePawn(svg,actor,contact,game.players[actor].pos)]).catch(()=>{});
      } else await showMiss(svg,contact).catch(()=>{});
    }
    curtain=!game.bot&&actor!==game.actor;
    runBot();render();
    if(game.bot&&game.actor===0&&game.phase==='predict')await flyBall($('court')?.querySelector('svg'),incomingFlight(view(game)),true).catch(()=>{});
  } catch(e) { if($('error'))$('error').textContent=e.message; }
  finally {busy=false;app.inert=false;app.removeAttribute('aria-busy');}
}

let courtSelect;
const aimRows=key=>(game.ball?TECH[key]:SERVES[key])?.length==='短'?[0]:[1];
function drawCourt() {
  if (!$('court')) return;
  const phase=game.phase, mode=phase==='shot'?'targets':phase==='adjust'?'return':['serverPosition','receiverPosition','predict'].includes(phase)?'positions':null;
  const max=phase==='predict'?Math.ceil(movement(game)/2):phase==='adjust'?lateBudget(game,playHand):9;
  $('court').innerHTML=courtMarkup(view(game),{mode,choice:mode==='targets'?target:selected,targetChoice:target,max,hand:playHand,rows:['shot','adjust'].includes(phase)?aimRows(playTech):[0,1],technique:playTech,instant:true});
  $('court').querySelectorAll('[data-kind=target]').forEach(b=>{b.onpointerenter=b.onfocus=()=>{
    if(busy)return;
    target={x:Number(b.dataset.x),y:Number(b.dataset.y)};const v=view(game),end=bouncePoint(target,false),start=playerPoint(mode==='return'?selected:v.own.pos,true);
    const path=$('court').querySelector('[data-plan]');if(path)path.setAttribute('d',`M${start.x} ${start.y}L${end.x} ${end.y}`);
    const mark=$('court').querySelector('[data-aim]');if(mark){mark.setAttribute('cx',end.x);mark.setAttribute('cy',end.y);}
    const op=playerPoint(v.positions[1-v.actor],false),reach=playerPoint({x:target.x,y:v.positions[1-v.actor].y},false);
    $('court').querySelector('[data-displacement]')?.setAttribute('d',`M${op.x} ${op.y-27}H${reach.x}`);
    $('court').querySelector('[data-displacement-cap]')?.setAttribute('d',`M${reach.x} ${op.y-34}v14`);
    $('court').querySelector('.aim-effect').textContent=aimSummary(v,playTech,target);
    const trial={...v,own:{...v.own,pos:selected},receive:v.receive&&{...v.receive,hand:playHand,read:playRead}};showOdds(shotPreview(trial,playTech,target),!v.ball);
  };});
  $('court').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(busy)return;
    const phaseBefore=game.phase,actorBefore=game.actor;
    courtSelect?.({x:Number(b.dataset.x),y:Number(b.dataset.y)},b.dataset.kind);
    if(game.phase!==phaseBefore||game.actor!==actorBefore)return;
    drawCourt();
    // 重绘后保留键盘焦点。
    $('court').querySelector(`button[data-kind="${b.dataset.kind}"][data-x="${b.dataset.x}"][data-y="${b.dataset.y}"]`)?.focus({preventScroll:true});
  });
}
function wireCourt(fn) { courtSelect=fn;drawCourt(); }
function render() {
  if (curtain) {
    app.innerHTML = `<h2>请将操作交给 ${game.actor?'B':'A'}</h2><p>上一位玩家请回避屏幕，下一位可查看自己的信息并决策。</p><button class="primary" id="handoff">我是 ${game.actor?'B':'A'}，继续</button>`;
    $('handoff').onclick=()=>{curtain=false;render();};return;
  }
  const v=view(game), phase=game.phase, end=['pointEnd','setEnd','matchEnd'].includes(phase);
  app.innerHTML = `<div class="row"><span class="score">A ${game.score[0]} : ${game.score[1]} B</span><span class="pill">局数 ${game.sets[0]} : ${game.sets[1]}</span><span>${game.target} 分制 · ${game.bestOf} 局制 · ${game.server?'B':'A'} 发球</span></div>
  <p class="steps">本分 ${game.rally} 板 · ${game.bot?'单人对练':'双人对决'}</p>
  <div class="play-layout"><div id="court"></div><div><section id="stage"></section>${errorBox}</div></div>
  <p class="last-event" aria-live="polite">${v.lastActions.some(Boolean)?v.lastActions.filter(Boolean).map(a=>`${a.actor?'B':'A'}：${a.headline}（骰 ${a.roll}）`).join('<br>'):'先看站位，再决定战术。'}</p>
  <details><summary>对手试探记录</summary><p>${['正手','反手'].map(h=>{const n=v.scouting[1-v.actor][h];return n?`${h}：尝试 ${n.attempts} / 接回 ${n.success} / 冒高 ${n.loose}`:`${h}：尚无观察`;}).join('；')}。少量样本不代表真实能力。</p></details>
  <details><summary>最近的对局记录</summary><ol class="log">${game.history.slice(-10).map(s=>`<li>${s}</li>`).join('')}</ol></details>
  ${help}<div class="actions"><button id="export">导出试玩记录</button><button id="reset">重新开局</button></div>`;
  $('reset').onclick=()=>{if(confirm('结束当前比赛并重新加点？')){game=null;builds=[];setupPlayer=0;allocationScreen();}};
  $('export').onclick=()=>{
    const data=publicReplay(game);
    const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download='tabletennis-playtest.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  const stage=$('stage');
  if(game.scenario){const n=document.createElement('p');n.className='notice';n.textContent=SCENARIOS[game.scenario].description;app.querySelector('.play-layout').before(n);}

  courtSelect=null;selected={...v.own.pos};target={x:2,y:1};
  playHand=v.receive?.hand||'正手';playRead=v.receive?.read||v.ball?.hintSpin||'下旋';playTech=null;manualPosition=false;recover=true;
  if(end) {
    stage.innerHTML=`<h2>${phase==='matchEnd'?`${game.winner?'B':'A'} 赢得比赛`:phase==='setEnd'?'本局结束':`${game.completedPoints.at(-1)?.winner?'B':'A'} 得分`}</h2><p class="notice">${game.result}</p>${phase==='matchEnd'||game.scenario?'<p>可以导出记录，或重新开局调整加点。</p>':'<button class="primary" id="next">'+(phase==='setEnd'?'开始下一局':'开始下一分')+'</button>'}`;
    if($('next'))$('next').onclick=()=>submit({});if(game.scenario){const b=document.createElement('button');b.textContent='重试本情景';b.onclick=()=>{game=scenarioGame(game.scenario);render();};stage.append(b);}drawCourt();
    const point=document.createElement('div');point.className='point-callout';point.textContent=`${game.completedPoints.at(-1)?.winner?'B':'A'} +1`;$('court').querySelector('.court-board').append(point);return;
  }
  const own=`<details class="own-skills"><summary>查看自己的能力</summary><p>${skills.map((s,i)=>s+' '+v.own.skills[i]).join(' / ')}</p></details>`;
  if(phase==='serverPosition'||phase==='receiverPosition') {
    if(phase==='serverPosition')selected.y=0;
    stage.innerHTML=`<p class="turn-label">${name(game.actor)} · ${phase==='serverPosition'?'发球':'接发球'}</p><h2>点一个站位</h2><p class="muted">直接点场地，就在那个位置准备。</p><button class="primary" id="stay">就在这里</button>${own}`;
    wireCourt(p=>submit({pos:p}));$('stay').onclick=()=>submit({pos:selected});return;
  }
  const spinChips=()=>`<div class="chips" aria-label="旋转判断">${spins.map(spin=>`<button data-spin="${spin}" aria-pressed="${spin===playRead}">${spin}</button>`).join('')}</div>`;
  if(phase==='predict') {
    selected=botAction(v,()=>.5,'early').pos;
    stage.innerHTML=`<p class="turn-label">${name(game.actor)} · 对手出球</p><h2>抢位置，还是再看一拍？</h2><p class="ball-cue">${v.ball.hint}</p>
    <div class="action-deck" id="prepare-actions">
    <button class="move-action" data-prepare="正手"><strong>抢正手</strong><span>提前占位，准备正手接球</span></button>
    <button class="move-action" data-prepare="反手"><strong>抢反手</strong><span>提前占位，准备反手接球</span></button>
    <button class="move-action" data-prepare="wait"><strong>再看一拍</strong><span>留在原位，换取更清楚的线索</span></button></div>
    <p id="movement-note" class="muted">场上浅色人影是建议站位，可以先点格子改变。</p>
    <details><summary>我想改判旋转</summary>${spinChips()}</details>${own}`;
    stage.querySelectorAll('[data-spin]').forEach(b=>b.onclick=()=>{playRead=b.dataset.spin;stage.querySelectorAll('[data-spin]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
    stage.querySelectorAll('[data-prepare]').forEach(b=>b.onclick=()=>{
      const waiting=b.dataset.prepare==='wait';
      submit({pos:waiting?v.own.pos:selected,wait:waiting,guess:playRead,hand:waiting?playHand:b.dataset.prepare});
    });
    wireCourt(p=>{selected=p;manualPosition=true;$('movement-note').textContent='已改好站位，点一个动作就行动。';});return;
  }
  if(['adjust','shot'].includes(phase)) {
    const serve=!v.ball,adjusting=phase==='adjust';
    stage.innerHTML=`<p class="turn-label">${name(game.actor)} · ${serve?'你的发球':'轮到你'}</p><h2>选一招，点球台出手</h2>
    ${serve?'<p class="ball-cue">用发球为下一板做铺垫</p>':`<p class="ball-cue">${v.ball.length}球 · ${v.ball.height==='高'?'冒高机会':'低球'} · 线索偏${v.ball.hintSpin}${v.ball.side?'带侧旋':''}</p>`}
    <div class="action-deck" id="main-actions"></div>
    <details id="more-actions"><summary>更多接法</summary><div class="action-deck" id="extra-actions"></div></details>
    <p class="fire-hint" id="fire-hint" aria-live="polite"></p>
    ${serve?'':`<details><summary>改用另一面 / 改判旋转</summary><div class="chips" aria-label="用手">${['正手','反手'].map(h=>`<button data-hand="${h}" aria-pressed="${h===playHand}">${h}</button>`).join('')}</div>${spinChips()}</details>`}
    <details><summary>看判定与还原</summary><p id="odds"></p><p id="output"></p><div id="reasons" class="muted"></div><button id="recover-action" aria-pressed="true">击球后还原一步：开</button></details>${own}`;
    const draft=(pos=selected,hand=playHand)=>({...v,own:{...v.own,pos},receive:serve?null:{...v.receive,hand,read:playRead}});
    const choices=()=>{
      if(serve)return Object.keys(SERVES).map(key=>({key,plan:null,available:true}));
      const basis={...v,receive:{...v.receive,read:playRead}};
      return Object.keys(TECH).map(key=>{
        const plan=receivePlan(basis,key,playHand);
        if(!plan)return {key,available:false,reason:'来不及切换击球面'};
        const option=techniqueOptions(draft(plan.pos,plan.hand)).find(t=>t.key===key);
        return {...option,plan};
      });
    };
    const badge=e=>e.chance===0?'够不到':e.chance>=90?'较稳':e.chance>=75?'有风险':'很冒险';
    const chooseTech=key=>{
      const item=choices().find(t=>t.key===key&&t.available);if(!item)return;
      playTech=key;manualPosition=false;
      if(item.plan){playHand=item.plan.hand;selected={...item.plan.pos};}
      target.y=aimRows(key)[0];refresh();
    };
    const refresh=()=>{
      const all=choices(),order=serve?['短下旋','短不转','急长上旋','侧下短球']:actionOrder(draft());
      const available=all.filter(t=>t.available),main=order.map(key=>available.find(t=>t.key===key)).filter(Boolean).slice(0,4);
      const active=available.find(t=>t.key===playTech);if(active&&!main.some(t=>t.key===playTech)){if(main.length===4)main.pop();main.push(active);}
      const extra=all.filter(t=>!main.some(m=>m.key===t.key));
      const cards=items=>items.map(t=>{
        const profile=serve?SERVES[t.key]:TECH[t.key];
        const e=serve?shotPreview(v,t.key):t.plan?shotPreview(draft(t.key===playTech?selected:t.plan.pos,t.key===playTech?playHand:t.plan.hand),t.key):null;
        const goal=({'摆短':'控短，限制起板','劈长':'送深下旋，调动对手','正手挑打':'台内抢先上手','反手拧拉':'台内拧出侧上旋','攻球':'主动快打','高吊拉起':'拉起下旋，转入进攻','前冲弧圈':'加速，压缩时间','挡球':'借力防守','快带':'迎前抢快','削球':'退台，改变旋转','扣杀':'抓住高球机会','救球':'先把球救回来'})[t.key]||(profile.length==='短'?'控短，试探接发':'突袭长球');
        return `<button class="stroke-action" data-tech="${t.key}" ${t.available?'':'disabled'} aria-pressed="${playTech===t.key}"><strong>${t.key}</strong><span>${t.available?goal:t.reason}</span>${t.available?`<small>${serve?'发球':t.plan.hand} · ${badge(e)}</small>`:''}</button>`;
      }).join('');
      $('main-actions').innerHTML=cards(main);$('extra-actions').innerHTML=cards(extra);$('more-actions').hidden=!extra.length;
      stage.querySelectorAll('[data-tech]').forEach(b=>b.onclick=()=>{chooseTech(b.dataset.tech);stage.querySelector(`[data-tech="${b.dataset.tech}"]`)?.focus({preventScroll:true});});
      stage.querySelectorAll('[data-hand]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.hand===playHand));
      stage.querySelectorAll('[data-spin]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.spin===playRead));
      const profile=serve?SERVES[playTech]:TECH[playTech],e=shotPreview(draft(),playTech,target);
      $('fire-hint').textContent=e.chance===0?'这个站位够不到球。可以换站位、换一招；无路可救时点球台结束本分。':`${playTech}已准备 · 点对方半台任意落点就击球${manualPosition?'（使用你的站位）':'（就位已预览）'}`;
      showOdds(e,serve);
      $('output').textContent=`回球：${profile.length} / ${profile.spin}${profile.side?'带侧旋':''} / 速度 ${profile.speed} / 旋转 ${profile.strength}`;
      $('reasons').textContent=e.reasons.join('；');drawCourt();
    };
    const resetPlan=()=>{
      const opts=choices(),compatible=t=>t.available&&(!TECH[t.key].hand||TECH[t.key].hand===playHand),pick=opts.find(t=>t.key===playTech&&compatible(t))||opts.find(compatible)||opts.find(t=>t.available);
      chooseTech(pick.key);
    };
    stage.querySelectorAll('[data-hand]').forEach(b=>b.onclick=()=>{playHand=b.dataset.hand;resetPlan();});
    stage.querySelectorAll('[data-spin]').forEach(b=>b.onclick=()=>{playRead=b.dataset.spin;resetPlan();});
    $('recover-action').onclick=()=>{recover=!recover;$('recover-action').setAttribute('aria-pressed',recover);$('recover-action').textContent=`击球后还原一步：${recover?'开':'关'}`;};
    const opts=choices(),preferred=serve?'短下旋':actionOrder(draft()).find(key=>opts.some(t=>t.key===key&&t.available));
    chooseTech(preferred||opts.find(t=>t.available).key);
    wireCourt((p,kind)=>{
      if(kind==='position'){selected=p;manualPosition=true;refresh();return;}
      target=p;
      submit({...(adjusting?{action:'return',pos:selected,hand:playHand,guess:playRead}:{}),target,technique:playTech,recover});
    });return;
  }

}
allocationScreen();
</script>
</html>
