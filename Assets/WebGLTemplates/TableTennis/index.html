<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1920"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%230e1920%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2210%22%20fill%3D%22%2378dfb9%22/%3E%3Ccircle%20cx%3D%2213%22%20cy%3D%2213%22%20r%3D%222%22%20fill%3D%22%230e1920%22/%3E%3C/svg%3E"><title>乒乓球物理试验场</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1920;color:#eaf5ed;font:16px system-ui,sans-serif}#stage{position:fixed;top:env(safe-area-inset-top);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left)}canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;background:#0e1920;z-index:10}h1{font-size:28px;margin:0 0 14px}p{line-height:1.7;max-width:480px;color:#b6c9c8}progress{width:min(300px,80vw);height:14px;accent-color:#78dfb9}a{color:#78dfb9}#status{font-variant-numeric:tabular-nums}button{touch-action:manipulation}
</style></head><body><main id="stage"><canvas id="unity-canvas" tabindex="0" aria-label="乒乓球物理实验：挥拍发球、出球、单板和接发研究"></canvas><div id="loading"><h1>乒乓球物理试验场</h1><p>选一个发球，比较不同拍型与接球方向。</p><progress id="progress" value="0" max="1"></progress><p id="status">正在加载…</p><p>首次加载需要下载资源，建议使用 Wi-Fi。<br>手机支持单指操作、双指缩放，横屏可扩大球台。</p><a href="https://github.com/willerhehehe/tabletennis-simulator" target="_blank" rel="noopener">源码、使用说明与参考资料</a></div></main><script>
const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading'),status=document.getElementById('status');
const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Willer',productName:'Table Tennis Physics Lab',productVersion:'{{{ PRODUCT_VERSION }}}',matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,2),showBanner:(message,type)=>{if(type==='error'){loading.style.display='flex';status.textContent=message;}}};
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onload=()=>createUnityInstance(canvas,config,p=>{document.getElementById('progress').value=p;status.textContent='正在加载 '+Math.round(p*100)+'%';}).then(instance=>{window.unityInstance=instance;loading.style.display='none';canvas.focus();}).catch(error=>{status.textContent='加载失败。请刷新页面，或改用新版 Safari / Chrome。';console.error(error);});script.onerror=()=>status.textContent='资源下载失败，请检查网络后刷新。';document.body.appendChild(script);
</script></body></html>
