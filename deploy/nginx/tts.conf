# Include inside the pinggo.willer.tech HTTPS server block.
location = /tts {
    return 301 /tts/$is_args$args;
}

location = /tts/ {
    alias /opt/tabletennis/current/;
    index index.html;
    default_type text/html;
    auth_basic off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /tts/index.html {
    alias /opt/tabletennis/current/index.html;
    default_type text/html;
    auth_basic off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /tts/ {
    alias /opt/tabletennis/current/;
    autoindex off;
    auth_basic off;
    # Unity's decompression fallback accepts .unityweb files without Content-Encoding headers.
    types { application/javascript js; text/css css; text/plain txt; application/json json; image/png png; image/svg+xml svg; application/wasm wasm; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
}
